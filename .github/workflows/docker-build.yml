name: Docker build

# Builds the calling repository's Dockerfile with Buildx and optionally pushes
# the image to GHCR. docker-pr.yml and docker-deploy.yml are thin wrappers
# around this workflow.
#
# Permissions are inherited from the caller. Pushing requires the caller to
# grant `packages: write`; building only requires `contents: read`.

on:
  workflow_call:
    inputs:
      image-name:
        description: Full image name without tag. Defaults to ghcr.io/<owner>/<repo>.
        type: string
        default: ""
      dockerfile:
        description: Path to the Dockerfile, relative to the repository root.
        type: string
        default: ./Dockerfile
      context:
        description: Docker build context, relative to the repository root.
        type: string
        default: .
      push:
        description: Push the image to GHCR. Never allowed from pull request events.
        type: boolean
        default: false
      platforms:
        description: Comma-separated target platforms.
        type: string
        default: linux/amd64
      target:
        description: Dockerfile stage to build. Defaults to the last stage.
        type: string
        default: ""
      test-target:
        description: Optional Dockerfile stage built before the image (e.g. a `test` stage). The build fails if this stage fails.
        type: string
        default: ""
      build-args:
        description: Newline-separated KEY=VALUE build arguments. Not for secrets.
        type: string
        default: ""
      runner:
        description: Runner label, or a JSON array of labels. Defaults to the BEDROCKNEXUS_RUNNER variable, then ubuntu-latest.
        type: string
        default: ""
    outputs:
      image:
        description: Lowercase image name without tag.
        value: ${{ jobs.build.outputs.image }}
      tags:
        description: Newline-separated list of fully qualified image tags.
        value: ${{ jobs.build.outputs.tags }}
      version:
        description: Primary version tag computed by docker/metadata-action.
        value: ${{ jobs.build.outputs.version }}
      digest:
        description: Image manifest digest. Empty when the image was not pushed.
        value: ${{ jobs.build.outputs.digest }}

jobs:
  build:
    name: Build
    # Accepts a plain label ("ubuntu-latest") or a JSON array
    # ('["self-hosted","linux","x64","bedrocknexus-builder"]').
    runs-on: ${{ startsWith(inputs.runner || vars.BEDROCKNEXUS_RUNNER || 'ubuntu-latest', '[') && fromJSON(inputs.runner || vars.BEDROCKNEXUS_RUNNER) || inputs.runner || vars.BEDROCKNEXUS_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    outputs:
      image: ${{ steps.image.outputs.name }}
      tags: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.meta.outputs.version }}
      digest: ${{ inputs.push && steps.build.outputs.digest || '' }}
    steps:
      - name: Refuse unsafe events
        if: github.event_name == 'pull_request_target' || (inputs.push && github.event_name == 'pull_request')
        run: |
          echo "::error::Refusing to run on '${GITHUB_EVENT_NAME}' (push=${{ inputs.push }}). pull_request_target is never supported and pull requests may not push. Use docker-pr.yml on 'pull_request' for PR validation."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve image name
        id: image
        env:
          IMAGE_NAME: ${{ inputs.image-name || format('ghcr.io/{0}', github.repository) }}
          TARGET: ${{ inputs.target }}
        shell: bash
        run: |
          image="${IMAGE_NAME,,}"
          echo "name=${image}" >> "$GITHUB_OUTPUT"
          # One cache per image/stage so monorepos with several images don't evict each other.
          echo "cache-scope=${image}${TARGET:+-${TARGET}}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: inputs.platforms != 'linux/amd64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          # `latest` is only moved by default-branch builds, never by tags.
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate (${{ inputs.test-target }})
        if: inputs.test-target != ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          target: ${{ inputs.test-target }}
          build-args: ${{ inputs.build-args }}
          cache-from: type=gha,scope=${{ steps.image.outputs.cache-scope }}
          push: false

      - name: Build${{ inputs.push && ' and push' || '' }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          target: ${{ inputs.target }}
          platforms: ${{ inputs.platforms }}
          build-args: ${{ inputs.build-args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ steps.image.outputs.cache-scope }}
          # A failed cache export must never fail a build that otherwise succeeded.
          cache-to: type=gha,mode=max,scope=${{ steps.image.outputs.cache-scope }},ignore-error=true
          push: ${{ inputs.push }}

      - name: Summary
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ inputs.push && steps.build.outputs.digest || '' }}
          PUSHED: ${{ inputs.push }}
        shell: bash
        run: |
          {
            echo "### Docker image"
            echo
            echo "- Image: \`${IMAGE}\`"
            echo "- Pushed: ${PUSHED}"
            if [[ -n "$DIGEST" ]]; then echo "- Digest: \`${DIGEST}\`"; fi
            echo
            echo "Tags:"
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
