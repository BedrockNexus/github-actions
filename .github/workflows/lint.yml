name: Lint

# Checks this repository's own workflows with actionlint (which also runs
# shellcheck on `run:` scripts).

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  ACTIONLINT_VERSION: 1.7.12

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        shell: bash
        run: |
          bash <(curl --silent --show-error --fail \
            "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") \
            "${ACTIONLINT_VERSION}" "$RUNNER_TEMP"

      - name: Run actionlint
        shell: bash
        run: |
          "$RUNNER_TEMP/actionlint" -color
